name: Tauri WebDriver E2E

# Webview-level key-interception coverage via tauri-driver (#560). Kept in a
# separate workflow from ci.yml because it builds the full desktop binary and
# drives a real WebView — slower and heavier than the Playwright suite.
#
# Runs on WINDOWS (WebView2 + Microsoft Edge WebDriver). tauri-driver supports
# Linux (WebKitGTK) and Windows (Edge), but NOT macOS. We deliberately target
# Windows/WebView2 rather than Linux/WebKitGTK: WebKitGTK's WebDriver wedges on
# native element/interaction commands (findElement, Actions/key injection) under
# xvfb software rendering for a non-trivial app — `execute` works but
# `findElement` hangs to the Mocha timeout and the session dies with
# `hyper::Error(IncompleteMessage)`. Tauri's own maintainers call WebKitGTK
# WebDriver "totally unstable". WebView2 is Chromium-backed, so native findElement
# + key Actions are reliable — and the prevent-default plugin under test enforces
# RELOAD via a platform-agnostic injected JS script (tauri-plugin-prevent-default
# `assets/script.js`), so Windows coverage is equally valid (Tandem declares the
# plugin with NO `platform-windows` feature, so there is no native-path divergence).

# DISPATCH-ONLY SINCE 2026-08-08 (#1197). The `push: tags: v*` trigger was
# removed because this job fails on every run and nobody has been able to
# reproduce the cause outside CI: `DevToolsActivePort file doesn't exist`, with
# the driver and the runtime at an EXACT version match (150.0.4078.105 across
# runs 30974836130 / 31022514071 / 31027157696) and the app provably alive in
# the same run — only the CDP handshake is missing. The obvious hypothesis is
# therefore refuted: the pin table below is working, and cause (a) from #1197,
# Microsoft's BlobNotFound CDN gap, is genuinely fixed. Do not start by chasing
# the pin; that ground is spent. The leading unverified suspect is a collision
# between wry's WebView2 AdditionalBrowserArguments and the driver's
# WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, which needs a human on a Windows box.
#
# The workflow is kept rather than deleted because re-enabling is one of three
# live outcomes at the 2026-11-01 review (#1345) — the others being replace it
# with a cheaper mechanism, or retire it and verify by hand. What is lost
# meanwhile is real: this is the only automated coverage of webview-level key
# interception, which the Playwright suite (real browser, not the Tauri WebView)
# structurally cannot reach. `docs/release-smoke-checklist.md` records the gap
# rather than dropping the row, so a release pass cannot mistake absence for a
# pass.
#
# Too heavy to gate every PR regardless (see #560 / batch scope-down decision).
# Deliberately a separate workflow from tauri-release.yml: a failure here was
# always a signal to investigate before announcing, never a gate blocking
# artifact publishing.
on:
  workflow_dispatch: {}

# Minimal token scope (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  webdriver:
    runs-on: windows-latest
    # Bounded so a systemic driver-CDN failure (TLS interception, proxy 407,
    # throttling) fails fast instead of burning a runner toward GitHub's
    # 360-minute default: the driver-resolution loop can try ~35 candidates at
    # -TimeoutSec 120 each, which is over an hour on its own.
    timeout-minutes: 45
    # The auto-launcher runs inside the Node server process; it tries to spawn
    # Claude and is irrelevant to webview key-interception coverage. Disable it
    # job-wide so neither the harness-started server nor any app-spawned sidecar
    # runs it under CI.
    env:
      TANDEM_DISABLE_LAUNCHER: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # The desktop shell spawns the Node sidecar on launch; the real binary
      # must exist (not a stub) so the WebView can actually load the frontend.
      - name: Download Node sidecar
        run: node scripts/download-node-sidecar.mjs

      # The reaper is an externalBin — `cargo tauri build` below fails its
      # existence check without it. Native host build (no --target).
      - name: Build reaper
        run: node scripts/build-reaper.mjs

      # `cargo tauri build` needs the Tauri CLI (cargo-tauri) — it is NOT a
      # built-in cargo subcommand and the repo doesn't vendor @tauri-apps/cli,
      # so install it explicitly (tauri-release.yml sidesteps this via
      # tauri-action, which vendors the CLI).
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # WebView2 apps are driven by the Edge WebDriver matching the WebView2
      # *Runtime* version — which on GitHub runners differs from the preinstalled
      # Edge *browser* (and the runner's preinstalled msedgedriver matches the
      # browser). A mismatch makes the WebDriver session HANG on connect (Tauri
      # docs warn this). So: read the WebView2 Runtime version from the registry,
      # resolve an Edge WebDriver for that major line, download it, and put it on
      # PATH (tauri-driver finds msedgedriver.exe there by itself; the verbose
      # shim below wraps THAT binary and is only adopted after it self-verifies).
      # Fail loudly at every step; never silently fall back to the
      # browser-matched driver (that reintroduces the hang).
      #
      # #1197: the version used to come solely from LATEST_RELEASE_<major>, a
      # pointer that can name a build whose zip is not on the CDN — v0.17.0's run
      # died on BlobNotFound for 150.0.4078.80 (.83 appeared days later), with no
      # retry or fallback. So walk an ordered list of in-major candidates and take
      # the first whose zip actually yields msedgedriver.exe:
      #   1. the EXACT runtime version — Microsoft's documented requirement is a
      #      driver matching the *runtime*, not merely its major;
      #   2. the LATEST_RELEASE_<major> pointer (the previous behaviour);
      #   3. a bounded patch walk-back down each of those two version lines, to
      #      land on the nearest actually-published build;
      #   4. a hand-pinned known-good build for that major, as the last-resort
      #      net (add a row when a new WebView2 major reaches the runners).
      # Every candidate is in-major by construction, and the chosen binary's own
      # --version output is re-checked against the runtime major afterwards, so
      # the chain can never quietly degrade into the browser-matched driver.
      - name: Set up Edge WebDriver matching the WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # WebView2 Runtime version: HKLM (machine-wide, the runner default),
          # falling back to HKCU (per-user install) before failing.
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = $null
          foreach ($root in @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients'
          )) {
            try { $pv = (Get-ItemProperty "$root\$guid" -ErrorAction Stop).pv } catch {}
            if ($pv) { break }
          }
          if (-not $pv) { throw 'Could not read WebView2 Runtime version from the registry' }
          $major = $pv.Split('.')[0]
          Write-Host "WebView2 Runtime: $pv (major $major)"

          # Known-good driver builds keyed by WebView2 major. Only consulted once
          # every live candidate has missed. Each row was verified downloadable
          # (HTTP 200, and the zip really contains msedgedriver.exe) when added.
          #
          # HOW THIS ROTS, measured rather than assumed (2026-08-20). It is NOT
          # that the CDN drops old blobs: the oldest row below, 149.0.4022.69,
          # was built 2026-06-12 and still downloads today, and #1197's original
          # failure was a LATEST_RELEASE_ pointer naming a build that was never
          # published at all. The rot is a NEW MAJOR WITH NO ROW:
          # `$pinned[$major]` on a missing key is $null and Add-Candidate returns
          # immediately, so the last-resort net simply is not there. Worse, a
          # MIS-KEYED row ('152' = '151.0...') is dropped by Add-Candidate's
          # in-major filter with no error AND without tripping the ContainsKey
          # warning below, because the key IS present. Both shapes are pinned by
          # tests/scripts/tauri-webdriver-pin.test.ts, which is the only thing
          # that reads this table on an ordinary PR - this job is dispatch-only,
          # so the annotations below reach nobody until someone runs it.
          #
          # REVIEW HOME: #1345, dated 2026-11-01, which already lists "the
          # current pinned driver table in the workflow versus what Microsoft
          # ships at review time" among the evidence it weighs. Edge ships stable
          # majors roughly every 4 weeks, so these rows cover the runners to
          # about October 2026 - up to that review, not past it. If #1345
          # resolves to "restore", the restore work needs a fresh dated gate for
          # this table, because #1345 closes and the table outlives it.
          # A row must NOT equal today's LATEST_RELEASE_<major>. Add-Candidate
          # deduplicates, so a pin equal to the pointer is dropped and the net is
          # present-but-degenerate: in exactly the #1197 failure (the pointer
          # names a build whose zip is missing) it contributes no candidate at
          # all. The same argument extends 16 further: a row inside the walk-back
          # window BELOW the pointer is deduplicated by the walk-back for the
          # identical reason, so every row must sit more than 16 patches under
          # its pointer, not merely differ from it.
          #
          # The pointers are recorded here, one line per row, because that is
          # what makes the rule checkable at all without a network call:
          # tests/scripts/tauri-webdriver-pin.test.ts parses these lines and
          # fails if a row has no pointer recorded, equals it, or sits within the
          # walk-back window under it. Re-fetch and rewrite them when you touch
          # the table - a row added without its pointer line fails that test.
          # Verified 2026-08-20, each pointer fetched from
          # msedgedriver.microsoft.com/LATEST_RELEASE_<major> and each row's
          # edgedriver_win64.zip downloaded (HTTP 200, contains msedgedriver.exe):
          #   LATEST_RELEASE_149 = 149.0.4022.98
          #   LATEST_RELEASE_150 = 150.0.4078.132
          #   LATEST_RELEASE_151 = 151.0.4129.93
          #   LATEST_RELEASE_152 = 152.0.4191.35
          $pinned = @{
            '149' = '149.0.4022.69'
            '150' = '150.0.4078.83'
            '151' = '151.0.4129.50'
            '152' = '152.0.4191.10'
          }
          # Say a missing row out loud (a ::warning:: annotation, visible on the
          # run page) instead of letting a green-until-it-isn't run hide it.
          if (-not $pinned.ContainsKey($major)) {
            Write-Host ("::warning::No hand-pinned Edge WebDriver for WebView2 major " + $major +
              " - the last-resort fallback is gone. Add a row to `$pinned in .github/workflows/tauri-webdriver.yml.")
          }

          # The LATEST_RELEASE_<major> file is a UTF-16 version string; strip
          # BOM/CR by keeping only version characters. A miss here is no longer
          # fatal — it is one candidate among several.
          $latest = $null
          try {
            $relFile = "$env:RUNNER_TEMP\edge_latest_release"
            Invoke-WebRequest "https://msedgedriver.microsoft.com/LATEST_RELEASE_$major" -OutFile $relFile -UseBasicParsing -TimeoutSec 30
            $latest = ([System.IO.File]::ReadAllText($relFile, [System.Text.Encoding]::Unicode) -replace '[^0-9.]', '')
          } catch {
            Write-Host "LATEST_RELEASE_${major} unavailable: $($_.Exception.Message)"
          }
          Write-Host "LATEST_RELEASE_${major}: $(if ($latest) { $latest } else { '(none)' })"

          $candidates = [System.Collections.Generic.List[string]]::new()
          function Add-Candidate([string]$v) {
            if (-not $v) { return }
            # Leaving the runtime's major is exactly the browser-matched-driver
            # hang this step exists to prevent — drop such candidates outright.
            if ($v.Split('.')[0] -ne $major) { return }
            if (-not $candidates.Contains($v)) { $candidates.Add($v) }
          }
          Add-Candidate $pv
          Add-Candidate $latest
          # The CDN publishes sparsely, so when a version misses, the nearest
          # existing build is usually a few patch numbers below it.
          foreach ($seed in @($latest, $pv)) {
            if (-not $seed) { continue }
            $parts = $seed.Split('.')
            if ($parts.Length -ne 4) { continue }
            $patch = [int]$parts[3]
            for ($i = 1; $i -le 16 -and ($patch - $i) -ge 0; $i++) {
              Add-Candidate "$($parts[0]).$($parts[1]).$($parts[2]).$($patch - $i)"
            }
          }
          Add-Candidate $pinned[$major]
          # No emptiness check here: $major is derived from $pv, so Add-Candidate
          # $pv is in-major with itself and always lands — the list cannot be
          # empty (the `if ($candidates.Count -eq 0) { throw }` that used to sit
          # here was unreachable). The order actually tried IS worth seeing.
          Write-Host "Candidates ($($candidates.Count)): $($candidates -join ', ')"

          # First candidate whose zip actually yields the binary wins. Each miss
          # reports WHY: with up to 35 candidates, a systemic failure (TLS
          # interception, proxy 407, throttling, full disk, corrupt zip) would
          # otherwise render as 35 identical content-free lines and read exactly
          # like the ordinary "this build was never published" 404.
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          $dir = "$env:RUNNER_TEMP\edgedriver"
          $driverVersion = $null
          foreach ($candidate in $candidates) {
            Remove-Item $zip, $dir -Recurse -Force -ErrorAction SilentlyContinue
            $ok = $false
            $miss = 'unknown'
            try {
              # PowerShell 7's default -TimeoutSec is 0 (indefinite): without a
              # bound, one hung CDN connection stalls until the job timeout, and
              # the candidate loop multiplies that by the whole list.
              Invoke-WebRequest "https://msedgedriver.microsoft.com/$candidate/edgedriver_win64.zip" -OutFile $zip -UseBasicParsing -TimeoutSec 120
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              $ok = Test-Path "$dir\msedgedriver.exe"
              if (-not $ok) { $miss = 'zip contained no msedgedriver.exe' }
            } catch {
              $status = 0
              $resp = $_.Exception.PSObject.Properties['Response']
              if ($resp -and $resp.Value) { $status = [int]$resp.Value.StatusCode }
              $reason = ($_.Exception.Message -replace '\s+', ' ')
              if ($status -eq 404) {
                $miss = 'HTTP 404 (build not published)'
              } else {
                $miss = "NOT a 404 - investigate: $reason"
              }
            }
            if ($ok) { $driverVersion = $candidate; break }
            Write-Host "  miss ${candidate}: $miss"
          }
          if (-not $driverVersion) {
            throw "No downloadable Edge WebDriver for WebView2 major ${major}; tried: $($candidates -join ', ')"
          }
          $how = if ($driverVersion -eq $pv) { 'exact runtime match' } else { 'in-major fallback' }
          Write-Host "Edge WebDriver: $driverVersion ($how; runtime $pv)"

          # Green-but-rescued is the other half of "fail loudly" (#1197). If the
          # hand-pinned row is what won, EVERY live candidate missed - the exact
          # runtime version, the LATEST_RELEASE_<major> pointer and every
          # walk-back build tried - which is #1197's original CDN failure
          # recurring, survived only because the net happened to still be
          # current. A run that rendered as an ordinary green would hide exactly
          # that, and the net is the one candidate guaranteed to expire.
          #
          # The count is interpolated, never hard-coded: the list is 35 builds
          # only when both live sources resolve and neither collides with the
          # walk-back. A LATEST_RELEASE_<major> fetch that throws leaves 18.
          if ($driverVersion -eq $pinned[$major] -and $driverVersion -ne $pv -and $driverVersion -ne $latest) {
            Write-Host ("::warning::Only the hand-pinned Edge WebDriver ($driverVersion) resolved for " +
              "WebView2 major ${major} - all $($candidates.Count) candidates tried missed, so " +
              "msedgedriver.microsoft.com or its LATEST_RELEASE_${major} pointer is broken again " +
              "(#1197). This run is green only because the last-resort pin is still current.")
          }

          # Defense in depth: a mislabelled blob must not become a silently
          # browser-matched driver, which is the connect-hang failure mode.
          $reported = (& "$dir\msedgedriver.exe" --version) -join ' '
          Write-Host $reported
          $reportedVersion = [regex]::Match($reported, '\d+(\.\d+){3}').Value
          if (-not $reportedVersion) { throw "Could not parse a version out of '$reported'" }
          if ($reportedVersion.Split('.')[0] -ne $major) {
            throw "msedgedriver $reportedVersion does not match WebView2 major $major"
          }

          # Visible to SUBSEQUENT steps (the wdio run, where tauri-driver spawns).
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      # `--debug` and `--no-bundle` are `tauri build` flags, so they must NOT sit
      # behind `--` (which forwards args to the underlying `cargo build`, where
      # `--debug` is rejected: it is cargo's default, not an accepted flag). The
      # beforeBuildCommand (`npm run build`) produces dist/client + dist/server.
      # Output: src-tauri/target/debug/tandem-desktop.exe.
      - name: Build Tauri debug binary
        run: cargo tauri build --debug --no-bundle

      - name: Install harness dependencies
        working-directory: tests/tauri-driver
        run: npm install

      # A `--no-bundle` debug binary can't resolve `dist/server` (the `resources`
      # aren't staged next to it), so it can't spawn its own Node sidecar and
      # :3479 never comes up — the WebView then thrashes reconnecting and the
      # WebDriver session destabilizes. So pre-start the server: the app's
      # debug-only health-gate (start_sidecar in src-tauri/src/sidecar.rs, platform-neutral) sees
      # :3479 healthy and skips its spawn, so the WebView connects to this one.
      #
      # The server is started INSIDE this step (not a prior one): a detached node
      # spawned in an earlier step is reaped by the runner's per-step process-tree
      # cleanup before the test runs — the first Windows run proved it (clean
      # startup banner, went healthy, then vanished with no crash/shutdown trace).
      # Started here it lives for exactly the test's lifetime; the `finally` stops
      # it and runner cleanup reaps it when the step ends. The step runs from the
      # repo root (no `working-directory`) so node resolves `dist/server/index.js`
      # + `dist/client` against the right cwd; `npm test` runs under Push-Location.
      # stdout/stderr go to separate files (Start-Process can't share one) that the
      # always() "Dump logs" step surfaces.
      - name: Run tauri-driver E2E (server started in-step so it survives to the test)
        shell: pwsh
        env:
          # Binary already built above; don't rebuild inside onPrepare.
          TAURI_SKIP_BUILD: "1"
          # Route msedgedriver through a verbose-logging shim (see wdio.conf.ts).
          # Opt-in so local runs keep the plain PATH lookup; the log is surfaced
          # by "Dump logs" below and is the only first-hand account of why the
          # driver did or didn't get a CDP endpoint out of the app (#1197).
          TAURI_DRIVER_VERBOSE_LOG: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $serverOut = "$env:RUNNER_TEMP\tandem-server.out.log"
          $serverErr = "$env:RUNNER_TEMP\tandem-server.err.log"
          $server = Start-Process node -ArgumentList 'dist/server/index.js' `
            -RedirectStandardOutput $serverOut `
            -RedirectStandardError  $serverErr `
            -WindowStyle Hidden -PassThru
          $code = 1
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                if ((Invoke-WebRequest 'http://127.0.0.1:3479/health' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) {
                  $healthy = $true; break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) {
              Write-Host 'server did not become healthy within 30s'
              Get-Content $serverErr -ErrorAction SilentlyContinue
            } else {
              Write-Host 'server up'
              Push-Location tests/tauri-driver
              npm test
              $code = $LASTEXITCODE
              Pop-Location
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }
          exit $code

      # Surface all logs on every outcome so a failure is diagnosable without
      # another blind ~10-min round. Any may be absent on an early crash
      # (SilentlyContinue keeps the always() step green); an empty app log is NOT
      # proof the app was healthy.
      - name: Dump logs
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== server stdout ==='
          Get-Content "$env:RUNNER_TEMP\tandem-server.out.log" -ErrorAction SilentlyContinue
          Write-Host '=== server stderr ==='
          Get-Content "$env:RUNNER_TEMP\tandem-server.err.log" -ErrorAction SilentlyContinue
          # Windows app_log_dir() = %LOCALAPPDATA%\<bundle-id>\logs; file_name
          # "tandem" -> tandem.log (bundle id com.tandem.editor).
          Write-Host '=== app log ==='
          Get-Content "$env:LOCALAPPDATA\com.tandem.editor\logs\tandem.log" -ErrorAction SilentlyContinue
          # #1197 diagnostics. The verbose driver log states the command line and
          # environment msedgedriver used to launch the app and what it waited
          # for; head-bounded because a verbose session log can run to megabytes.
          Write-Host '=== msedgedriver log (first 1500 lines) ==='
          Get-Content "$env:RUNNER_TEMP\msedgedriver.log" -TotalCount 1500 -ErrorAction SilentlyContinue
          # Best-effort only — this CANNOT discriminate "written somewhere else"
          # from "never written". msedgedriver launches the app with its own
          # scoped temp --user-data-dir and deletes that tree when the session
          # tears down, so by the time this always() step runs the file is gone
          # in both cases and an empty result proves nothing. A HIT is
          # informative (a stray copy survived a crash, or the app wrote one
          # under its own LOCALAPPDATA); a miss is not evidence of anything. The
          # verbose driver log above is the discriminating artifact: it names the
          # user-data dir it passed and the file it waited on.
          Write-Host '=== DevToolsActivePort files (a hit is informative; a miss is not) ==='
          Get-ChildItem -Path "$env:LOCALAPPDATA\com.tandem.editor", "$env:TEMP" `
            -Filter 'DevToolsActivePort' -Recurse -Depth 4 -Force -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName
