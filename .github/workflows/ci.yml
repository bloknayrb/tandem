name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege for every job here (CodeQL `actions/missing-workflow-permissions`).
# Without this block each job gets the repository's default token scopes, which on
# a repo configured for read/write is far more than any of them uses.
#
# `contents: read` is the whole set, and it is not the reflex answer — it is what
# the jobs were audited to need. Nothing in this file comments on a PR, publishes a
# check run, pushes a ref, or calls the API: there is no `secrets.`, `GITHUB_TOKEN`,
# `github.token` or `gh` invocation anywhere in it. The cache and artifact services
# (`Swatinem/rust-cache`, `setup-node`'s `cache: npm`, `upload-artifact` v4+)
# authenticate with ACTIONS_RUNTIME_TOKEN rather than GITHUB_TOKEN, so they need no
# scope of their own.
#
# **`contents: read` is load-bearing, not decorative.** Besides `actions/checkout`,
# the `check` job runs `git fetch --no-tags --depth=1 origin tag v0.21.0` over the
# credential checkout persists — the acceptance harness reads its immutable skill
# baseline from that tag via `git show`, and `actions/checkout` is depth-1 and
# tagless. `permissions: {}` would 403 there, and the failure would look like a
# harness bug rather than a permissions one.
#
# Declared at workflow level rather than per job, deliberately: all six jobs need
# the identical minimum, and inheritance means a job added later is least-privileged
# by default instead of silently reacquiring the repo default. A future job needing
# more takes a job-level block — which REPLACES rather than merges, so such an
# override must restate `contents: read` if it still checks out code.
permissions:
  contents: read

jobs:
  rust-test:
    # macos-latest is here for coverage, not parity: the `NativeHost::MacOs`
    # arm of the native-theme decision layer (#992) — the only host where an
    # override is ever active — was asserted on no leg at all while this was
    # ubuntu + windows. macOS needs none of the apt block below and the stub
    # step is already $TRIPLE-generic, so it costs one line.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain selects its toolchain from the ref NAME, so a
      # SHA pin without an explicit `toolchain:` would try to install a
      # toolchain literally named 4360b52... . Pinning the action does NOT pin
      # the toolchain: every run still gets whatever `stable` is that day.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libxdo-dev: required by the tauri `linux-libxdo` feature (#923) so
          # native Cut/Copy/Paste/Select All context-menu items link on Linux.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Create stubs for tauri_build resource checks
        shell: bash
        run: |
          mkdir -p src-tauri/binaries dist/channel dist/server dist/client dist/stdio-bridge
          TRIPLE="$(rustc -Vv | grep '^host' | cut -d' ' -f2)"
          touch "src-tauri/binaries/node-sidecar-${TRIPLE}"
          touch "src-tauri/binaries/node-sidecar-${TRIPLE}.exe"
          touch "src-tauri/binaries/tandem-reaper-${TRIPLE}"
          touch "src-tauri/binaries/tandem-reaper-${TRIPLE}.exe"

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Compile the standalone reaper crate on every platform. Its per-OS reaping
  # path (reaper/src/{linux,macos,windows}.rs) is cfg-gated, so macos.rs only
  # ever compiled on the tag-triggered Tauri Release matrix — a nix-0.29 API
  # break in it shipped undetected until release time. This job builds the
  # reaper for each host so a platform-specific source error fails a PR, not a
  # release tag. Cheap (~tiny crate); separate from rust-test, which stubs the
  # reaper binary and never builds the crate.
  reaper-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `toolchain:` is required alongside the SHA pin -- see the note in the
      # rust-test job above.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: reaper

      - name: Build reaper (compiles the host's reaping path)
        run: cargo build --release --manifest-path reaper/Cargo.toml

  # #1529: the ONLY tests that spawn real `icacls` -- the #1299 proof that a
  # machine already poisoned by the old non-inheritable grant recovers by running
  # the fixed build -- had no runner anywhere. `check` is the only vitest job and
  # it is ubuntu-latest, so those specs loaded, skipped, and reported green on
  # every push since they were written. Measured: under the JSON reporter
  # `doc-backup-acl-repair.test.ts` scores file status `passed` on Linux with a
  # single `skipped` assertion.
  #
  # `vitest run <specs>` would NOT fix that -- it is green on exactly the hosts
  # where the proof cannot run. `scripts/ci/windows-acl-proof.mjs` is the gate: it
  # refuses on a non-Windows platform, refuses without icacls.exe, and requires
  # each named Windows-gated `describe` to show >=1 passed / 0 skipped / 0 failed.
  # Deliberately unconditional and blocking -- no `if:`, no `continue-on-error`
  # (here or on the job), no `needs:`, no `|| true`. `shell:` is deliberately
  # absent so the runner's default pwsh template applies, which ends in
  # `exit $LASTEXITCODE` and therefore propagates node's status.
  #
  # Node + vitest only, on purpose: no lint, no biome, no typecheck. A Windows
  # checkout is where CLAUDE.md's `core.autocrlf` x `.gitattributes eol=lf`
  # hazard bites, and this gate must not be able to go red for a line-ending
  # reason unrelated to ACLs.
  #
  # Cost, measured against run 32325964215: `check` is 13m02s and every job starts
  # within 1s of the others, so this ~2-3min leg adds no PR wall clock; the repo
  # is public, so GitHub-hosted minutes are unmetered.
  #
  # tests/scripts/windows-acl-proof-wiring.test.ts parses this job and fails --
  # on the ubuntu leg -- if any of the above changes or the job is removed.
  windows-acl-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Real-icacls proof (#1299 recovery path)
        run: node scripts/ci/windows-acl-proof.mjs
        timeout-minutes: 10

  # Publishes the coverage BASELINE as an artifact. Separate from `check` on
  # purpose: instrumentation adds roughly 10-30% to the suite's wall clock
  # (measured locally: `tests` 765s uninstrumented against 847-982s across
  # runs), and `check` is already this repo's longest job.
  #
  # This said "roughly doubles" while citing the same numbers, which is 1.28x at
  # the high end -- a claim a reader could disprove with the arithmetic in the
  # sentence carrying it.
  #
  # Since Unit 13 it IS a threshold gate, for 14 named modules only — there is
  # still no repository-wide threshold, and nothing fails for the repo total
  # being low. `scripts/ci/coverage-gate.mjs` compares
  # `scripts/ci/coverage-policy.json` against the summary and exits non-zero on
  # a module below its floor, uninstrumented, absent, or collapsed in size.
  #
  # **That gate is ADVISORY, because this job is not a required status check.**
  # A red `coverage` does not block a merge today; making it required is a
  # branch-protection setting, tracked in its own issue. Do not describe this
  # job as blocking until that flips — re-measure with
  # `gh api repos/bloknayrb/tandem/branches/master/protection` rather than
  # trusting this comment.
  #
  # A percentage floor detects new code arriving untested. It does NOT detect
  # deleted behaviour — the arithmetic is in the comparator's header. The half
  # that catches deletion, and the half that blocks, are the same one:
  # `tests/scripts/coverage-gate-wiring.test.ts` runs inside `check` and fails
  # there if the gated set shrinks, a floor drifts past its allowance, a gated
  # module's named behavioural suite disappears, a coverage-ignore hint appears
  # in a gated file, or this job becomes conditional.
  #
  # It DOES fail when the measurement did not happen, and there is no `|| true`
  # anywhere for that reason. "No repository-wide threshold" is a statement
  # about the coverage level; it is not a licence for the job to report success
  # when it could not evaluate, which is the #1229 failure mode this repo has
  # now produced three times. `scripts/ci/coverage-manifest.mjs` refuses to
  # write an artifact when zero statements were measured, when a family the
  # config claims to measure has no files in the report, or when a source area
  # sits at uniformly zero covered statements (what a single-project run looks
  # like from the outside).
  #
  # The artifact uploads with `if: always()` because the manifest is most worth
  # reading on the run where something went wrong.
  #
  # tests/scripts/coverage-manifest-wiring.test.ts parses this job and fails --
  # inside `check` -- if any of the above changes or the job is removed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coverage baseline
        run: npm run test:coverage
        timeout-minutes: 30

      - name: Upload coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-baseline
          path: |
            coverage/baseline-manifest.json
            coverage/coverage-summary.json
            coverage/index.html
            coverage/**/*.html

  # Is the Node runtime we BUNDLE still current on its line? (#1747)
  #
  # The pin sat at 22.17.0 for fourteen months while five security releases went
  # past it, and nothing noticed -- the jobs above all run `node-version: 22`,
  # the latest, so the suite never exercises the runtime that ships to desktop
  # users. Nothing in the test tree can notice either: the version is a constant,
  # and whether it is STALE is a fact about the outside world.
  #
  # Advisory on purpose, and it stays that way. This is the only job here that
  # reaches the network, so making it required would let a nodejs.org outage
  # block every merge -- and the thing it detects (a pin going stale over
  # months) is never urgent enough to justify that. It reports 3, not 0, when it
  # cannot evaluate, so an outage is distinguishable from "all clear".
  #
  # tests/scripts/node-sidecar-pin-wiring.test.ts parses this job and fails --
  # inside `check` -- if it is disarmed or removed (ADR-051). It needs no
  # `npm ci` and no token, which is what keeps the permissions note above true.
  node-sidecar-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Bundled Node pin is current
        run: node scripts/ci/node-sidecar-pin.mjs
        timeout-minutes: 5

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Pinned rather than trusting the runner image to expose a Python at all.
      # Both `npm run test:acceptance-harness` (via
      # scripts/spikes/run-acceptance-harness.mjs) and the vitest fixture block
      # resolve `python3` then `python`, so either name satisfies them -- but if no
      # interpreter can be provisioned this step fails the job, which is the only
      # acceptable alternative to running the gate. Never a skipped step.
      #
      # It sits HERE, not next to the harness step, because the `Test` step needs
      # it too: tests/scripts/acceptance-harness-wiring.test.ts spawns
      # scripts/spikes/run_acceptance_tests.py against deliberately broken fixture
      # suites, and those assertions are the only coverage the runner's decisions
      # have. They fail rather than skip when no interpreter is found, so without
      # this they would fail confusingly instead of not at all -- but failing
      # confusingly is still a cost worth removing.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Biome format check
        run: npx biome check .

      - name: Typecheck (client)
        run: npx tsc --noEmit -p tsconfig.client.json

      - name: Typecheck (server)
        run: npx tsc --noEmit -p tsconfig.server.json

      # The root config covers `src/` -- including `src/cli`, which neither the
      # client nor the server config includes. It already ran, but only inside
      # the `Build` step five steps below, so a type error in the 2,905-line
      # doctor.ts surfaced behind `Test`, the tag fetch and the acceptance
      # harness rather than here. This is about WHEN it fails, not whether it
      # runs.
      - name: Typecheck (root)
        run: npx tsc --noEmit

      # `tests/` was in no tsconfig at all until #1616, so no type-checker had
      # ever read a line of it. Pinned by tests/scripts/typecheck-tests-wiring.test.ts,
      # which parses this file and fails if the step is removed, made
      # conditional, or allowed to continue-on-error.
      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Test
        run: npm test -- --run

      # The session-monitor acceptance harness (82 tests) guards the first-use
      # auto-arm gate and had no runner in CI or the pre-push hook until #1399 --
      # which is how #1397 bumped skills/tandem/SKILL.md to version 11, breaking
      # 13 harness tests, with every check on both PRs green throughout.
      #
      # It reads its immutable v9 skill baseline with
      # `git show v0.21.0:skills/tandem/SKILL.md`. checkout@v6 is a depth-1,
      # tagless clone, so the tag has to be fetched. Measured against this repo:
      # one tag at depth 1 costs ~2.7s and takes .git from 9.0MB to 38MB, against
      # ~6.3s/68MB for `fetch-depth: 0` and 57MB for `fetch-tags: true`. The
      # reason it is this and not those is not the constant: a single-tag fetch is
      # O(1) in repo age, while both alternatives grow with history/tag count
      # forever, on this repo's longest job. Committing the baseline as a fixture
      # was rejected -- it trades an immutable reference for a tracked copy that
      # the same commit which needs to lie about it can edit.
      #
      # No `|| true`: a missing ref exits 128 and must fail HERE, at a step whose
      # name carries the tag, rather than 40 lines into a Python traceback.
      - name: Fetch v0.21.0 tag (acceptance-harness skill baseline)
        run: git fetch --no-tags --depth=1 origin tag v0.21.0
        timeout-minutes: 2

      # Deliberately unconditional and blocking: no `if:`, no `continue-on-error`
      # (here or on the job), no `|| true`. A gate that reports success when it
      # could not evaluate is the #1229 failure mode and is worse than no gate.
      # Must stay below `npm ci`: one test spawns
      # scripts/spikes/session-monitor-user-event.mjs, which imports
      # @hocuspocus/provider. tests/scripts/acceptance-harness-wiring.test.ts
      # parses this file and fails if any of that changes.
      - name: Acceptance harness (session-monitor auto-arm)
        run: npm run test:acceptance-harness
        timeout-minutes: 3

      - name: Build
        run: npm run build

      - name: Verify harness components stripped from client bundle
        run: node scripts/ci/verify-harness-stripped.mjs

      - name: Stdio smoke test
        run: node scripts/ci/stdio-smoke.mjs
        timeout-minutes: 2

      - name: Monitor subcommand smoke test
        run: node scripts/ci/monitor-smoke.mjs
        timeout-minutes: 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clear ports before E2E
        run: |
          echo "Ports in use before E2E:"
          # 3478/3479/5173: product + dev ports (the diag step below still uses
          # them). 4573/4728/4729: the E2E harness's reserved ports — keep in
          # sync with scripts/test-ports.ts.
          lsof -i :3478 -i :3479 -i :5173 -i :4573 -i :4728 -i :4729 2>/dev/null || echo "(none)"
          fuser -k 3478/tcp 3479/tcp 5173/tcp 4573/tcp 4728/tcp 4729/tcp 2>/dev/null || true
          sleep 1

      - name: Verify backend server starts
        timeout-minutes: 1
        run: |
          echo "=== Starting dist/server/index.js for health check ==="
          TANDEM_APP_DATA_DIR=/tmp/tandem-diag \
          TANDEM_NO_SAMPLE=1 \
          node dist/server/index.js > /tmp/server-diag.txt 2>&1 &
          SERVER_PID=$!
          HEALTHY=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:3479/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              HEALTHY=1
              break
            fi
            echo "  ${i}s: not yet healthy"
          done
          echo "=== Server output ==="
          cat /tmp/server-diag.txt || true
          echo "=== End server output ==="
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          fuser -k 3478/tcp 3479/tcp 2>/dev/null || true
          sleep 1
          if [ $HEALTHY -eq 0 ]; then
            echo "FAIL: server did not become healthy within 30s"
            exit 1
          fi

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          # `test-results/` carries Playwright's trace.zip / video.webm /
          # screenshot artifacts (configured in playwright.config.ts via
          # trace/screenshot/video). Without this path, diagnosing a CI-only
          # flake requires re-running the spec locally.
          path: |
            playwright-report/
            test-results/
