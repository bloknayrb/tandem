name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Merge queue. If one is enabled, GitHub builds a temporary
  # `gh-readonly-queue/master/...` branch holding master plus this PR plus
  # everything queued ahead of it, and fires `merge_group` against it; the PR
  # merges only if the required checks pass THERE. The queue was meant to replace `strict: true` (require-branches-up-
  # to-date), but as measured on 2026-10-21 a PR behind master is still refused
  # by the merge API until it is updated and re-run, and a direct merge works
  # without the queue. See CLAUDE.md's Status section before relying on either.
  #
  # **Without this trigger the queue does not fail — it HANGS.** No workflow runs
  # on the merge group, the required checks never report, and each PR sits until
  # the queue times out and evicts it. Fail-safe (nothing wrong merges) but
  # totally opaque, and it looks like a GitHub outage rather than a missing
  # trigger. `tests/scripts/acceptance-harness-wiring.test.ts` and
  # `windows-acl-proof-wiring.test.ts` both pin this key for that reason.
  #
  # Unfiltered, like `pull_request:` above: a `branches:` filter here would
  # re-create the hang for the branch it excludes.
  merge_group:
  workflow_dispatch:

# Least privilege for every job here (CodeQL `actions/missing-workflow-permissions`).
# Without this block each job gets the repository's default token scopes, which on
# a repo configured for read/write is far more than any of them uses.
#
# `contents: read` is the whole set, and it is not the reflex answer — it is what
# the jobs were audited to need. Nothing in this file comments on a PR, publishes a
# check run, pushes a ref, or calls the API: there is no `secrets.`, `GITHUB_TOKEN`,
# `github.token` or `gh` invocation anywhere in it. The cache and artifact services
# (`Swatinem/rust-cache`, `setup-node`'s `cache: npm`, `upload-artifact` v4+)
# authenticate with ACTIONS_RUNTIME_TOKEN rather than GITHUB_TOKEN, so they need no
# scope of their own.
#
# **`contents: read` is load-bearing, not decorative.** Besides `actions/checkout`,
# the `check` job runs `git fetch --no-tags --depth=1 origin tag v0.21.0` over the
# credential checkout persists — the acceptance harness reads its immutable skill
# baseline from that tag via `git show`, and `actions/checkout` is depth-1 and
# tagless. `permissions: {}` would 403 there, and the failure would look like a
# harness bug rather than a permissions one.
#
# Declared at workflow level rather than per job, deliberately: all eight jobs need
# the identical minimum, and inheritance means a job added later is least-privileged
# by default instead of silently reacquiring the repo default. A future job needing
# more takes a job-level block — which REPLACES rather than merges, so such an
# override must restate `contents: read` if it still checks out code.
permissions:
  contents: read

jobs:
  rust-test:
    # macos-latest is here for coverage, not parity: the `NativeHost::MacOs`
    # arm of the native-theme decision layer (#992) — the only host where an
    # override is ever active — was asserted on no leg at all while this was
    # ubuntu + windows. macOS needs none of the apt block below and the stub
    # step is already $TRIPLE-generic, so it costs one line.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain selects its toolchain from the ref NAME, so a
      # SHA pin without an explicit `toolchain:` would try to install a
      # toolchain literally named 4360b52... . Pinning the action does NOT pin
      # the toolchain: every run still gets whatever `stable` is that day.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # The GitHub-hosted Ubuntu image ships a Google Chrome apt source that we do
      # not use — Playwright downloads its own chromium binary, and `--with-deps`
      # installs system libraries rather than Chrome. When that repo serves a
      # Packages.gz whose hash disagrees with its Release file, `apt-get update`
      # exits 100 and every job that touches apt dies in its dependency step,
      # before any Tandem code runs. Dropping the source makes an outage in a
      # repository we have no use for stop gating merges.
      - name: Drop the unused Google Chrome apt source
        if: matrix.os == 'ubuntu-latest'
        run: sudo find /etc/apt/sources.list.d -maxdepth 1 -name 'google*' -print -delete

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libxdo-dev: required by the tauri `linux-libxdo` feature (#923) so
          # native Cut/Copy/Paste/Select All context-menu items link on Linux.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Create stubs for tauri_build resource checks
        shell: bash
        run: |
          mkdir -p src-tauri/binaries dist/channel dist/server dist/client dist/stdio-bridge dist/desktop
          # A bundle resource since the third-party notices work; generated for
          # real by tauri.conf.json's beforeBuildCommand.
          touch dist/desktop/THIRD_PARTY_NOTICES.txt
          TRIPLE="$(rustc -Vv | grep '^host' | cut -d' ' -f2)"
          touch "src-tauri/binaries/node-sidecar-${TRIPLE}"
          touch "src-tauri/binaries/node-sidecar-${TRIPLE}.exe"
          touch "src-tauri/binaries/tandem-reaper-${TRIPLE}"
          touch "src-tauri/binaries/tandem-reaper-${TRIPLE}.exe"

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Compile the standalone reaper crate on every platform. Its per-OS reaping
  # path (reaper/src/{linux,macos,windows}.rs) is cfg-gated, so macos.rs only
  # ever compiled on the tag-triggered Tauri Release matrix — a nix-0.29 API
  # break in it shipped undetected until release time. This job builds the
  # reaper for each host so a platform-specific source error fails a PR, not a
  # release tag. Cheap (~tiny crate); separate from rust-test, which stubs the
  # reaper binary and never builds the crate.
  reaper-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `toolchain:` is required alongside the SHA pin -- see the note in the
      # rust-test job above.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: reaper

      - name: Build reaper (compiles the host's reaping path)
        run: cargo build --release --manifest-path reaper/Cargo.toml

      # #1988: the reaper's `--exec-with-pdeathsig` mode is the desktop shell's
      # Linux sidecar trampoline, and `reaper/tests/exec_pdeathsig.rs` is its
      # only proof (thread-death delivery, the parent re-check, no PATH search).
      # The tests are `cfg(target_os = "linux")`, so the other legs compile
      # them to nothing. This job is advisory; `tests/scripts/reaper-test-wiring.test.ts`
      # inside `check` pins this step (ADR-051).
      - name: Test reaper
        run: cargo test --manifest-path reaper/Cargo.toml

  # #1529: the ONLY tests that spawn real `icacls` -- the #1299 proof that a
  # machine already poisoned by the old non-inheritable grant recovers by running
  # the fixed build -- had no runner anywhere. No vitest job ran on Windows then
  # (`check` is ubuntu-latest), so those specs loaded, skipped, and reported green
  # on every push since they were written. `vitest-windows` below now runs the
  # whole suite on Windows, but it is advisory and accepts a skipped describe;
  # this job is the required one and refuses a skip. Measured: under the JSON reporter
  # `doc-backup-acl-repair.test.ts` scores file status `passed` on Linux with a
  # single `skipped` assertion.
  #
  # `vitest run <specs>` would NOT fix that -- it is green on exactly the hosts
  # where the proof cannot run. `scripts/ci/windows-acl-proof.mjs` is the gate: it
  # refuses on a non-Windows platform, refuses without icacls.exe, and requires
  # each named Windows-gated `describe` to show >=1 passed / 0 skipped / 0 failed.
  # Deliberately unconditional and blocking -- no `if:`, no `continue-on-error`
  # (here or on the job), no `needs:`, no `|| true`. `shell:` is deliberately
  # absent so the runner's default pwsh template applies, which ends in
  # `exit $LASTEXITCODE` and therefore propagates node's status.
  #
  # Node + vitest only, on purpose: no lint, no biome, no typecheck. A Windows
  # checkout is where CLAUDE.md's `core.autocrlf` x `.gitattributes eol=lf`
  # hazard bites, and this gate must not be able to go red for a line-ending
  # reason unrelated to ACLs.
  #
  # Cost, measured against run 32325964215: `check` is 13m02s and every job starts
  # within 1s of the others, so this ~2-3min leg adds no PR wall clock; the repo
  # is public, so GitHub-hosted minutes are unmetered.
  #
  # tests/scripts/windows-acl-proof-wiring.test.ts parses this job and fails --
  # on the ubuntu leg -- if any of the above changes or the job is removed.
  windows-acl-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Real-icacls proof (#1299 recovery path)
        run: node scripts/ci/windows-acl-proof.mjs
        timeout-minutes: 10

  # The whole vitest suite, on Windows (#2397).
  #
  # `check` runs vitest on ubuntu-latest only, and cloud sessions are Linux. PR
  # #2370 had every check green and 12 of its new tests failing on a Windows 11
  # machine, every time; the pre-push hook runs the full suite, so one such
  # merge blocks every later push from that machine. This job is where CI sees
  # it first.
  #
  # **ADVISORY: this is not a required status check.** A red `vitest-windows`
  # does not block a merge. Whether it becomes required is #2398 (decide by
  # 2026-12-15); re-measure with
  # `gh api repos/bloknayrb/tandem/branches/master/protection` rather than
  # trusting this comment. To read a red one: compare it with this job's latest
  # run on master. A failure master also has is not the PR's; a new one usually
  # is, though the suite has load-sensitive tests on Windows.
  #
  # It mirrors `check`: the same Node and Python setup, the same install, the
  # same `npm run build` (several suites skip without `dist/`), the same vitest
  # command and the same file anchor, so a run that collects nothing or loses
  # files is red. Lint, biome, the test-tree typecheck, the acceptance harness
  # and E2E stay in `check` alone.
  #
  # What a green run does NOT show:
  #  - that no test was skipped. The anchor compares FILES; a test given a
  #    `skipIf(win32)` still reports its file as run. `windows-acl-proof` above
  #    is the job that refuses a skip, for the specs registered with it.
  #  - anything `tests/setup/acl-win-mock.ts` mocks: `setRestrictiveAcl` is a
  #    mock in every file here except the specs that opt out of it.
  #
  # Two accommodations for the hosted runner, and no others. Both make the
  # runner look like an ordinary Windows machine; neither skips a test, and
  # neither changes a flag vitest gets.
  #  - TEMP's long name. The runner's TEMP is the 8.3 short form
  #    `C:\Users\RUNNER~1\...`, and tests that compare a temp path with its
  #    resolved form fail on it. The step resolves it and exports the result
  #    for the steps after it. It stays in the runner's own profile: pointing
  #    TEMP at `runner.temp` instead (run 42949488007) made three real-icacls
  #    fixtures fail their own precondition under `D:\a\_temp`, and
  #    platform.test.ts fail because app data was no longer under LOCALAPPDATA.
  #    The first runs of this job, on the bare runner, also failed on a product
  #    defect this step hid: Node's JS `fs.realpathSync` keeps an 8.3 short
  #    name where `fs.promises.realpath` expands it, and the product compared
  #    the two (the launcher's resolver pairs, the document key, the drift
  #    preview's bundled-folder list). That is fixed (#2400), so those tests are
  #    expected to pass with a short TEMP as well (not run that way here: this
  #    job never has one). The step stays, and more depends on it than before:
  #    a document is now keyed on its LONG path, so any test that computes an
  #    expected id or key from the raw temp path fails on a short TEMP.
  #    tests/server/short-name-documents.win.test.ts builds its own short
  #    spellings on a root taken from the native realpath, so it does not
  #    depend on TEMP's.
  #  - the `\tmp` step. tests/server/document-service.test.ts writes under a
  #    literal `/tmp`, which Node resolves to `\tmp` on the working directory's
  #    drive; the runner has none there.
  # The tests these two steps turn green depend on the host, not on the code
  # under test. Fixing them is the way to remove a line here; adding a line
  # here is not the way to fix a test.
  #
  # Measured on this job's first runs, at master's code (2026-11-11): 19
  # failures in 6 files with neither accommodation (run 42947480897), 2 with
  # both (run 42951568059). The 2 are in
  # tests/server/integrations/resolve-claude-launch.test.ts, which built a
  # relative path from the working directory (`D:`) to TEMP (`C:`); across
  # drives `path.relative` returns an absolute one. The PR that added this
  # job (#2399) rewrote those two tests to stand in the temp directory
  # instead. One failure appeared on one run
  # only: apply-malformed.test.ts's two-caller race, on run 42949488007.
  #
  # `shell:` is absent on purpose: the default pwsh template ends in
  # `exit $LASTEXITCODE`. `cache: npm` shares its key with `windows-acl-proof`
  # and the Windows release leg (OS + arch + lockfile hash).
  #
  # The job-level timeout is here because GitHub's default is six hours and an
  # advisory job that hangs keeps a PR's checks pending that long. The job takes
  # about nine minutes.
  #
  # No `if`, `needs`, `strategy`, `name`, job `env` or `continue-on-error`.
  # tests/scripts/vitest-windows-wiring.test.ts parses this job inside `check`
  # and fails if any of that changes or the job is removed (ADR-051).
  vitest-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      # The Test step needs a Python, exactly as in `check` (see the comment there).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Give TEMP its long name
        run: node -e "const fs=require('node:fs');const t=fs.realpathSync.native(require('node:os').tmpdir());fs.appendFileSync(process.env.GITHUB_ENV,'TEMP='+t+'\nTMP='+t+'\n')"

      - name: Create the \tmp directory document-service.test.ts writes under
        run: node -e "require('node:fs').mkdirSync('/tmp',{recursive:true})"

      - name: Test
        run: npm test -- --run --reporter=default --reporter=json --outputFile.json=.vitest-report.json

      - name: Every collected test file actually ran
        if: ${{ !cancelled() }}
        run: node scripts/ci/vitest-file-anchor.mjs .vitest-report.json

  # Publishes the coverage BASELINE as an artifact. Separate from `check` on
  # purpose: instrumentation adds roughly 10-30% to the suite's wall clock
  # (measured locally: `tests` 765s uninstrumented against 847-982s across
  # runs), and `check` is already this repo's longest job.
  #
  # This said "roughly doubles" while citing the same numbers, which is 1.28x at
  # the high end -- a claim a reader could disprove with the arithmetic in the
  # sentence carrying it.
  #
  # Since Unit 13 it IS a threshold gate, for 14 named modules only — there is
  # still no repository-wide threshold, and nothing fails for the repo total
  # being low. `scripts/ci/coverage-gate.mjs` compares
  # `scripts/ci/coverage-policy.json` against the summary and exits non-zero on
  # a module below its floor, uninstrumented, absent, or collapsed in size.
  #
  # **That gate is ADVISORY, because this job is not a required status check.**
  # A red `coverage` does not block a merge today; making it required is a
  # branch-protection setting, tracked in its own issue. Do not describe this
  # job as blocking until that flips — re-measure with
  # `gh api repos/bloknayrb/tandem/branches/master/protection` rather than
  # trusting this comment.
  #
  # A percentage floor detects new code arriving untested. It does NOT detect
  # deleted behaviour — the arithmetic is in the comparator's header. The half
  # that catches deletion, and the half that blocks, are the same one:
  # `tests/scripts/coverage-gate-wiring.test.ts` runs inside `check` and fails
  # there if the gated set shrinks, a floor drifts past its allowance, a gated
  # module's named behavioural suite disappears, a coverage-ignore hint appears
  # in a gated file, or this job becomes conditional.
  #
  # It DOES fail when the measurement did not happen, and there is no `|| true`
  # anywhere for that reason. "No repository-wide threshold" is a statement
  # about the coverage level; it is not a licence for the job to report success
  # when it could not evaluate, which is the #1229 failure mode this repo has
  # now produced three times. `scripts/ci/coverage-manifest.mjs` refuses to
  # write an artifact when zero statements were measured, when a family the
  # config claims to measure has no files in the report, or when a source area
  # sits at uniformly zero covered statements (what a single-project run looks
  # like from the outside).
  #
  # **How to read a red here (#1862).** The measurement, the manifest and the
  # floors are three steps, not one `&&` chain: any vitest exit used to
  # short-circuit the chain, so the gate never ran and the job showed the
  # identical red a genuine floor breach gets. Measured 2026-09-09 on a
  # docs-only PR — vitest exited 1 on an EnvironmentTeardownError with 652 files
  # passed and 0 failed, no floor breached and no floor evaluated.
  #
  # A red `Coverage floors` means the gate RAN — read its last line.
  # `[coverage-gate] N failure(s).` is a real floor breach on a measurement that
  # completed and was accepted. `The gate could not evaluate. This is not a
  # pass.` is a measurement that did not happen; read the two steps above it.
  # Not covered here: a measurement that exited 0 having silently lost test
  # files still grades as a floor breach — that is the vitest file anchor in
  # `check` (#1673).
  #
  # The artifact uploads with `if: always()` because the manifest is most worth
  # reading on the run where something went wrong.
  #
  # tests/scripts/coverage-manifest-wiring.test.ts parses this job and fails --
  # inside `check` -- if any of the above changes or the job is removed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Coverage baseline
        id: baseline
        run: npm run test:coverage
        timeout-minutes: 30

      - name: Coverage manifest
        if: ${{ !cancelled() }}
        run: npm run coverage:manifest

      - name: Coverage floors
        if: ${{ !cancelled() }}
        run: npm run coverage:gate
        env:
          TANDEM_MEASUREMENT_OUTCOME: ${{ steps.baseline.outcome }}

      # `Upload coverage baseline` stays LAST. It is `if: always()` and its
      # `path:` names coverage/baseline-manifest.json, which the `Coverage
      # manifest` step above now produces — appending the new steps after the
      # upload would publish an artifact missing the file that made the
      # 2026-09-09 diagnosis possible.
      - name: Upload coverage baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-baseline
          path: |
            coverage/baseline-manifest.json
            coverage/coverage-summary.json
            coverage/index.html
            coverage/**/*.html

  # Is the Node runtime we BUNDLE still current on its line? (#1747)
  #
  # The pin sat at 22.17.0 for fourteen months while five security releases went
  # past it, and nothing noticed -- the jobs above all run `node-version: 22`,
  # the latest, so the suite never exercises the runtime that ships to desktop
  # users. Nothing in the test tree can notice either: the version is a constant,
  # and whether it is STALE is a fact about the outside world.
  #
  # Advisory on purpose, and it stays that way. This is the only job here that
  # reaches the network, so making it required would let a nodejs.org outage
  # block every merge -- and the thing it detects (a pin going stale over
  # months) is never urgent enough to justify that. It reports 3, not 0, when it
  # cannot evaluate, so an outage is distinguishable from "all clear".
  #
  # tests/scripts/node-sidecar-pin-wiring.test.ts parses this job and fails --
  # inside `check` -- if it is disarmed or removed (ADR-051). It needs no
  # `npm ci` and no token, which is what keeps the permissions note above true.
  node-sidecar-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      - name: Bundled Node pin is current
        run: node scripts/ci/node-sidecar-pin.mjs
        timeout-minutes: 5

  # Multi-session ownership ships dark (#2358, ADR-054; ownership design §12).
  # This job runs everything flag-on, so the dark code is exercised on every
  # push while a release build stays byte-for-byte flag-off.
  #
  # It is a REQUIRED check on master while ownership is dark (in branch
  # protection since 2026-11-08, #2377), so its guarantees are enforced twice:
  # by protection and by the wiring test in `check`. It is dropped from the
  # required set at the flip (PR 6).
  #
  #  - The build forces __OWNERSHIP_ENABLED__ on through tsup's API
  #    (scripts/ci/build-ownership-on.ts); tsup.config.ts itself reads no
  #    environment, so nothing else can.
  #  - The probe boots that bundle with NO TANDEM_OWNERSHIP and checks it is
  #    ownership-ON, so the define, not the env fallback, did it.
  #  - The Test and E2E steps carry TANDEM_OWNERSHIP=1, so the suites run
  #    flag-on whether the code under test is bundled or loaded by tsx/vitest.
  #  - The anchor runner refuses unless tests/server/ownership-anchor.test.ts —
  #    which runs only flag-on — passed, so a run whose variable never reached
  #    the workers reads red. The file anchor catches lost test files, as in
  #    `check`.
  #
  # No `needs`, `strategy`, job `name`, `if`, `env` or `continue-on-error`: a
  # skipped job reports success to branch protection, and a renamed one never
  # reports at all. tests/scripts/ownership-flag-on-wiring.test.ts parses this
  # job inside `check` and fails if any of that changes (ADR-051).
  ownership-flag-on:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      # The Test step needs a Python, exactly as in `check` (see the comment there).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - run: npm ci --ignore-scripts

      # No Typecheck step: the define is a `declare const` boolean, so the types
      # are the same either way and `check` already typechecks this head.
      - name: Build (ownership on)
        run: node node_modules/tsx/dist/cli.mjs scripts/ci/build-ownership-on.ts

      - name: Built bundle is ownership-on
        run: node scripts/ci/ownership-bundle-probe.mjs --expect on
        timeout-minutes: 2

      - name: Test
        run: npm test -- --run --reporter=default --reporter=json --outputFile.json=.vitest-report.json
        env:
          TANDEM_OWNERSHIP: "1"

      - name: Ownership anchor ran flag-on
        if: ${{ !cancelled() }}
        run: node scripts/ci/ownership-flag-on-runner.mjs .vitest-report.json

      - name: Every collected test file actually ran
        if: ${{ !cancelled() }}
        run: node scripts/ci/vitest-file-anchor.mjs .vitest-report.json

      - name: Drop the unused Google Chrome apt source
        run: sudo find /etc/apt/sources.list.d -maxdepth 1 -name 'google*' -print -delete

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          TANDEM_OWNERSHIP: "1"

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-ownership-flag-on
          path: |
            playwright-report/
            test-results/

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      # Pinned rather than trusting the runner image to expose a Python at all.
      # Both `npm run test:acceptance-harness` (via
      # scripts/spikes/run-acceptance-harness.mjs) and the vitest fixture block
      # resolve `python3` then `python`, so either name satisfies them -- but if no
      # interpreter can be provisioned this step fails the job, which is the only
      # acceptable alternative to running the gate. Never a skipped step.
      #
      # It sits HERE, not next to the harness step, because the `Test` step needs
      # it too: tests/scripts/acceptance-harness-wiring.test.ts spawns
      # scripts/spikes/run_acceptance_tests.py against deliberately broken fixture
      # suites, and those assertions are the only coverage the runner's decisions
      # have. They fail rather than skip when no interpreter is found, so without
      # this they would fail confusingly instead of not at all -- but failing
      # confusingly is still a cost worth removing.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Biome format check
        run: npx biome check .

      # Relative links, anchors and images across every Markdown file git knows
      # about, plus the docs vault's invariants: every live docs/**/*.md is
      # reachable from docs/README.md and every docs/screenshots/*.png is used.
      # It lists files with `git ls-files`, which the checkout's `.git` serves.
      # Unconditional and blocking -- pinned by
      # tests/scripts/check-links-wiring.test.ts (ADR-051).
      - name: Doc links
        run: npm run check:links

      - name: Typecheck (client)
        run: npx tsc --noEmit -p tsconfig.client.json

      - name: Typecheck (server)
        run: npx tsc --noEmit -p tsconfig.server.json

      # The root config covers `src/` -- including `src/cli`, which neither the
      # client nor the server config includes. It already ran, but only inside
      # the `Build` step lower down, so a type error in the 2,905-line doctor.ts
      # surfaced there rather than here. This is about WHEN it fails, not
      # whether it runs. (#1748 moved `Build` above `Test`, which shortens that
      # gap; `Build` still runs after every typecheck step, so this is still the
      # earlier failure.)
      - name: Typecheck (root)
        run: npx tsc --noEmit

      # `tests/` was in no tsconfig at all until #1616, so no type-checker had
      # ever read a line of it. Pinned by tests/scripts/typecheck-tests-wiring.test.ts,
      # which parses this file and fails if the step is removed, made
      # conditional, or allowed to continue-on-error.
      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Build
        run: npm run build

      # Multi-session ownership ships dark (#2358, ADR-054). This boots the
      # bundle just built with TANDEM_OWNERSHIP=1 in its environment and checks
      # it still behaves ownership-OFF (session ids printed raw in its log): a
      # release must ignore the variable, and a define dropped from
      # tsup.config.ts, or an identifier ownership-flag.ts reads under another
      # name, would let it through. The probe builds the child's environment
      # itself, so this step sets none. Its `ownership-flag-on` twin expects ON.
      # tests/scripts/ownership-flag-on-wiring.test.ts pins this step whole.
      - name: Release bundle ignores TANDEM_OWNERSHIP
        run: node scripts/ci/ownership-bundle-probe.mjs --expect off
        timeout-minutes: 2

      # The build generated dist/THIRD_PARTY_NOTICES.txt (and failed if it could
      # not). This checks the other half: that the file actually reaches the npm
      # tarball, and that the build-only files beside it (dist/.third-party,
      # the desktop placeholder) do not. A `files` edit could drop either.
      - name: Verify third-party notices ship in the npm tarball
        run: node scripts/third-party-notices/generate.mjs verify-pack

      # The desktop notices are generated only inside the tag-triggered release
      # matrix. This runs their crate checks (licence overrides, native-code
      # and reviewed-licence entries) for all four release triples now, so a
      # Cargo dependency bump that needs one fails here rather than after the
      # tag. `cargo metadata --filter-platform` needs no installed targets.
      # Same pinned toolchain as rust-test rather than whatever the image ships,
      # and the cache saves re-downloading every crate source on each PR.
      # `toolchain:` is required alongside the SHA pin -- see the note in the
      # rust-test job.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Check desktop third-party notices for every release target
        run: node scripts/third-party-notices/generate.mjs check-crates

      - name: Test
        run: npm test -- --run --reporter=default --reporter=json --outputFile.json=.vitest-report.json

      # #1673: vitest's summary counts what it RAN, and nothing compared that
      # against what it COLLECTED. A run that loses files to
      # `[vitest-pool]: Failed to start forks worker` reports a smaller total
      # and can exit 0 — a green that should be red.
      #
      # `if: ${{ !cancelled() }}`, never `always()` and never `success()`: a run
      # can both fail a test AND lose files, so the anchor must survive a red
      # `Test`, while `success()` would re-create the bug this step is about.
      #
      # An exit-3 here after a SKIPPED `Test` step means an earlier step in this
      # job failed (npm ci, a lint, a typecheck) and vitest never ran — not that
      # files were lost. This step's last output line tells the two apart: a
      # named cannot-evaluate reason, versus a DID-NOT-RUN list.
      #
      # tests/scripts/vitest-file-anchor-wiring.test.ts pins this step's `run`,
      # `if`, `continue-on-error` and `shell`, and the `Test` step's `run`, all
      # by exact equality (ADR-051).
      - name: Every collected test file actually ran
        if: ${{ !cancelled() }}
        run: node scripts/ci/vitest-file-anchor.mjs .vitest-report.json

      # The session-monitor acceptance harness (82 tests) guards the first-use
      # auto-arm gate and had no runner in CI or the pre-push hook until #1399 --
      # which is how #1397 bumped skills/tandem/SKILL.md to version 11, breaking
      # 13 harness tests, with every check on both PRs green throughout.
      #
      # It reads its immutable v9 skill baseline with
      # `git show v0.21.0:skills/tandem/SKILL.md`. checkout@v6 is a depth-1,
      # tagless clone, so the tag has to be fetched. Measured against this repo:
      # one tag at depth 1 costs ~2.7s and takes .git from 9.0MB to 38MB, against
      # ~6.3s/68MB for `fetch-depth: 0` and 57MB for `fetch-tags: true`. The
      # reason it is this and not those is not the constant: a single-tag fetch is
      # O(1) in repo age, while both alternatives grow with history/tag count
      # forever, on this repo's longest job. Committing the baseline as a fixture
      # was rejected -- it trades an immutable reference for a tracked copy that
      # the same commit which needs to lie about it can edit.
      #
      # No `|| true`: a missing ref exits 128 and must fail HERE, at a step whose
      # name carries the tag, rather than 40 lines into a Python traceback.
      - name: Fetch v0.21.0 tag (acceptance-harness skill baseline)
        run: git fetch --no-tags --depth=1 origin tag v0.21.0
        timeout-minutes: 2

      # Deliberately unconditional and blocking: no `if:`, no `continue-on-error`
      # (here or on the job), no `|| true`. A gate that reports success when it
      # could not evaluate is the #1229 failure mode and is worse than no gate.
      # Must stay below `npm ci`: one test spawns
      # scripts/spikes/session-monitor-user-event.mjs, which imports
      # @hocuspocus/provider. tests/scripts/acceptance-harness-wiring.test.ts
      # parses this file and fails if any of that changes.
      - name: Acceptance harness (session-monitor auto-arm)
        run: npm run test:acceptance-harness
        timeout-minutes: 3

      - name: Verify harness components stripped from client bundle
        run: node scripts/ci/verify-harness-stripped.mjs

      - name: Stdio smoke test
        run: node scripts/ci/stdio-smoke.mjs
        timeout-minutes: 2

      - name: Monitor subcommand smoke test
        run: node scripts/ci/monitor-smoke.mjs
        timeout-minutes: 1

      # The GitHub-hosted Ubuntu image ships a Google Chrome apt source that we do
      # not use — Playwright downloads its own chromium binary, and `--with-deps`
      # installs system libraries rather than Chrome. When that repo serves a
      # Packages.gz whose hash disagrees with its Release file, `apt-get update`
      # exits 100 and every job that touches apt dies in its dependency step,
      # before any Tandem code runs. Dropping the source makes an outage in a
      # repository we have no use for stop gating merges.
      - name: Drop the unused Google Chrome apt source
        run: sudo find /etc/apt/sources.list.d -maxdepth 1 -name 'google*' -print -delete

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clear ports before E2E
        run: |
          echo "Ports in use before E2E:"
          # 3478/3479/5173: product + dev ports (the diag step below still uses
          # them). 4573/4728/4729: the E2E harness's reserved ports — keep in
          # sync with scripts/test-ports.ts.
          lsof -i :3478 -i :3479 -i :5173 -i :4573 -i :4728 -i :4729 2>/dev/null || echo "(none)"
          fuser -k 3478/tcp 3479/tcp 5173/tcp 4573/tcp 4728/tcp 4729/tcp 2>/dev/null || true
          sleep 1

      - name: Verify backend server starts
        timeout-minutes: 1
        run: |
          echo "=== Starting dist/server/index.js for health check ==="
          TANDEM_APP_DATA_DIR=/tmp/tandem-diag \
          TANDEM_NO_SAMPLE=1 \
          node dist/server/index.js > /tmp/server-diag.txt 2>&1 &
          SERVER_PID=$!
          HEALTHY=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:3479/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              HEALTHY=1
              break
            fi
            echo "  ${i}s: not yet healthy"
          done
          echo "=== Server output ==="
          cat /tmp/server-diag.txt || true
          echo "=== End server output ==="
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          fuser -k 3478/tcp 3479/tcp 2>/dev/null || true
          sleep 1
          if [ $HEALTHY -eq 0 ]; then
            echo "FAIL: server did not become healthy within 30s"
            exit 1
          fi

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          # `test-results/` carries Playwright's trace.zip and failure
          # screenshots (playwright.config.ts sets `trace: on-first-retry` and
          # `screenshot: only-on-failure`; video is deliberately NOT enabled).
          # Without this path, diagnosing a CI-only flake requires re-running
          # the spec locally.
          path: |
            playwright-report/
            test-results/
