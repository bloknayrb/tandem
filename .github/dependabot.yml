# Dependabot version updates.
#
# This file was the unedited GitHub template until #1744 -- `package-ecosystem`
# was the empty string, which is not a valid ecosystem, so no update PR has ever
# been possible. That mattered once every action in .github/workflows/ became
# SHA-pinned (#1745): a pin with nothing to bump it trades supply-chain risk for
# silent staleness.
#
# `github-actions` is deliberately NOT grouped, while `npm` and `cargo` are.
# Grouping turns a week of action bumps into one PR mutating a dozen 40-hex
# strings -- precisely the artifact in which one wrong SHA is invisible. The
# individual PRs are the point. See CONTRIBUTING.md for the provenance check
# every github-actions bump needs before merge: GitHub resolves
# `owner/repo@<sha>` against the whole fork network, so a SHA that exists only in
# a fork resolves and runs, and no shape check in CI can detect that.
#
# tests/scripts/workflow-action-pin.test.ts pins the `github-actions` entry by
# exact equality, so disabling it (`open-pull-requests-limit: 0`, an `ignore`
# catch-all, a `target-branch`, a longer interval) fails `check` rather than
# quietly producing zero PRs forever.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # `ignore` is legal here and NOT on the github-actions entry above:
  # tests/scripts/workflow-action-pin.test.ts pins that entry by exact object
  # equality (so an `ignore` catch-all there fails `check`), while the npm entry
  # is constrained only by the ecosystem-list assertion.
  #
  # `update-types` scopes the group to minor+patch, so MAJORS are excluded from
  # it and Dependabot files them as individual PRs instead. That is the same
  # reasoning the github-actions entry above is ungrouped for: the risky bumps
  # are the ones that must arrive one per PR, reviewable on their own merits.
  #
  # This is the second fix for one disease. `patterns: ["*"]` alone groups every
  # npm update into one PR, so a single unmergeable bump holds the rest hostage.
  # #2061 was that: 42 updates of which only `typescript 5.9.3 -> 7.0.2` could
  # not resolve, and 41 healthy ones were held, re-filed red every week. The
  # `ignore` below was the point patch for that one dependency. #2068 was the
  # SAME shape with no bad actor to name -- 41 updates whose seven manifest-level
  # changes were six majors (@hocuspocus/{provider,server}, zod 3->4, vitest
  # 4->5, markdown-it 14->15) plus one biome minor, so `check` went red on lint
  # and the 34 healthy transitive bumps were unmergeable as a unit. Splitting by
  # update-type fixes the class; ignoring dependencies one at a time does not.
  #
  # The cost is real and is the point: a major now needs its own review, and a
  # major nobody reviews is a PR that sits open rather than a bump that rides in
  # under 40 other diffs.
  #
  # REMOVE THE `ignore` BELOW once svelte-check publishes TypeScript 7 support.
  # `svelte-check@4.7.6` is the latest published version, its peer range is
  # `typescript@"^5.0.0 || ^6.0.0"`, and no v5 line exists, so `npm ci` fails
  # ERESOLVE. While it stands, TypeScript majors are not proposed at all -- which
  # is strictly narrower than the update-types split above, and still needed:
  # the split would file the TypeScript major as its own PR, permanently red.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The three holds below have the TypeScript shape: a major that is known
      # red and already tracked, which the update-types split would otherwise
      # re-file every week as a PR nobody can merge. Each is a MIGRATION with
      # its own issue; the PR doing that migration removes its entry. Held in
      # this file rather than by `@dependabot ignore` comments, which live on
      # GitHub and are invisible to anyone reading the repo.
      #
      # REMOVE with #2098 (zod 3 -> 4 migration).
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # REMOVE with #2099. Server and provider must move in ONE PR -- a lone
      # provider major can typecheck and still break at runtime against the
      # older server -- so the hold covers the whole scope.
      - dependency-name: "@hocuspocus/*"
        update-types: ["version-update:semver-major"]
      # REMOVE per #2100, once prosemirror-markdown's dependency range accepts
      # markdown-it 15 (1.13.8 still requires ^14, so a root bump bundles two
      # copies and feeds a v15 tokenizer to a v14-typed MarkdownParser).
      - dependency-name: "markdown-it"
        update-types: ["version-update:semver-major"]

  # Split by update-type for the same reason as npm above. Cargo has not yet hit
  # the hostage failure, but the shape is identical -- and a Rust major is worse
  # to review in a group, because `Cargo.lock` churns hundreds of lines around
  # the two `Cargo.toml` edits that actually carry the semantics. #2067 was four
  # grouped updates of which two were majors (`dirs` 6->7, `windows-version`
  # 0.1->0.100); both happened to be safe, which is luck, not a process.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
