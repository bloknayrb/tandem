# Tandem license ISSUANCE endpoint (Cloudflare Worker).
# Owner-deployed — see docs/licensing-operations.md. Receives Paddle Billing
# webhooks, looks the buyer up through the Paddle API, mints Ed25519-signed
# licenses, records them, and emails them. Replace the placeholders below with
# your own account's values before `npx wrangler deploy`.
#
# Deploy a SEPARATE instance per environment (Paddle sandbox vs live): they are
# separate Paddle accounts, each with its own notification destination, webhook
# secret and API key. The sandbox instance is the `[env.sandbox]` block at the
# end: deploy it, and set its secrets, with `--env sandbox` on EVERY command. A
# bare command targets production. The block re-declares its vars and KV
# namespaces because Wrangler does not inherit those into an environment, so a
# sandbox deploy can never fall back to production's namespaces or settings.

name = "tandem-license-issuance"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

[vars]
# "production" (default) or "sandbox". A sandbox deployment writes the ledger
# (so you can inspect issuance) but NOT the update entitlement.
TANDEM_ISSUANCE_ENV = "production"
# The verified Resend sender, e.g. "Tandem <noreply@yourdomain.com>".
# MUST be on a domain verified in Resend with SPF/DKIM/DMARC, or Resend returns
# 422 and every license email fails. See the auto-disable warning below.
# REQUIRED. The Worker validates this on every request and returns 503
# (`stage: "config-resend-from"`) while it is unset, still this placeholder, or
# not address-shaped — deploying it unedited stops issuance rather than minting
# a license, charging the buyer, and then failing to email it. No length cap
# here (unlike SUPPORT_EMAIL): this value is a header, never rendered into the
# email body, so a long display name is legal.
RESEND_FROM = "REPLACE_WITH_VERIFIED_SENDER"
# Monitored inbox used as the license email's reply_to. Keep in sync with
# TANDEM_SUPPORT_EMAIL in src/shared/constants.ts. Without it a buyer whose
# activation fails has no inbound channel except the public issue tracker —
# where they will paste a key carrying their own email address.
# REQUIRED. The Worker validates this on every request and returns 503
# (`stage: "config-support-email"`) while it is unset, still this placeholder,
# or not address-shaped — deploying it unedited stops issuance rather than
# emailing the placeholder to someone who just paid.
SUPPORT_EMAIL = "REPLACE_WITH_SUPPORT_INBOX"
# Operator alerting. `dropped` results and email-delivery failures are the two
# outcomes that lose sales silently.
#   ALERT_WEBHOOK_URL — any incoming webhook (Slack/Discord/ntfy). REQUIRED to be
#     alerted about EMAIL failures: those cannot be reported through Resend,
#     which is the thing that just failed. Without it, an email-stage alert is
#     deliberately dropped rather than sent down the broken path.
#   ALERT_EMAIL — operator inbox for everything else, sent via Resend.
# ALERT_WEBHOOK_URL = "REPLACE_WITH_INCOMING_WEBHOOK_URL"
# ALERT_EMAIL = "REPLACE_WITH_OPERATOR_INBOX"
#
# The Paddle price ids this Worker may mint for, comma-separated (`pri_...`).
# REQUIRED: a Paddle.js checkout accepts any ACTIVE price id with the public
# client token, so without this a leftover test price would mint perpetual
# licenses. 503 (`stage: "config-price-ids"`) while empty or malformed. Removing
# a price here is part of the kill switch (ops §7).
PADDLE_PRICE_IDS = "REPLACE_WITH_PADDLE_PRICE_IDS"

# Retention. Without this the log lines above are kept NOWHERE: `wrangler tail`
# is a live stream that dies with the terminal session, so a `dropped` or
# `stage: "email"` line is unreadable ten minutes later. Alerting is the half
# that reaches a human; this is the half that lets them see what happened.
[observability]
enabled = true

# Daily delivery check: alerts on failed or needs-retry Paddle notifications and
# on an inactive destination. A bad signature never alerts (anyone can send
# one), so this is what notices a webhook secret that no longer matches.
[triggers]
crons = ["0 13 * * *"]

# Update entitlements: licenseId -> { updateWindowEnd, status, version }. This
# MUST be the SAME namespace the license-update Worker reads (paste the same id
# you used in infra/license-update-worker/wrangler.toml — the placeholder name
# is identical in both files so a copy/paste mismatch is obvious). Contains NO
# PII. A mismatch here is silent: issuance succeeds and buyers get working
# licenses that are never offered an update.
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "REPLACE_WITH_LICENSE_KV_NAMESPACE_ID"

# Issuance ledger: order:<mode>:<txn_id> -> record (email, licenseId, ...), plus
# evt:<mode>:<event_id> replay markers, notice:<mode>:<stage>:<ref> records for
# a human to act on, and txnlic:<mode>:<txn_id>:<licenseId> index entries (every
# key carries the test/live mode segment). Holds PII — a SEPARATE,
# issuance-only namespace the update Worker never binds. Create with
# `npx wrangler kv namespace create LEDGER_KV`.
[[kv_namespaces]]
binding = "LEDGER_KV"
id = "REPLACE_WITH_LEDGER_KV_NAMESPACE_ID"

# Secrets (set with `npx wrangler secret put <NAME>`, never in this file):
#   TANDEM_PRIVATE_KEY    Ed25519 PEM PKCS#8: the private half of a key in public-key.ts
#                         whose id is in TRUSTED_KEY_IDS (worker.ts), or every webhook 503s
#   PADDLE_WEBHOOK_SECRET pdl_ntfset_... from the Paddle notification destination
#   PADDLE_API_KEY        pdl_live_apikey_... / pdl_sdbx_apikey_... with customer.read
#                         and notification read ONLY; expires (max 1 year), so set a
#                         reminder. A live key in a sandbox-mode Worker is refused.
#   RESEND_API_KEY        re_... from Resend
#   GRANDFATHER_EMAILS    optional, comma/space-separated beta-tester emails
#
# SANDBOX_BUYER_EMAILS and SANDBOX_SIGNING_UNTIL are vars, not secrets, and live
# only in the [env.sandbox] block below.

# ---------------------------------------------------------------------------
# Sandbox instance (Paddle sandbox account). Every command: `--env sandbox`.
# Deploys as "tandem-license-issuance-sandbox".
#
# It signs with the PRODUCTION key (ops §3.5b), because a throwaway key fails
# the trusted-key guard. Every license it emails therefore activates Tandem for
# real and never expires. Three things bound that:
#   - SANDBOX_BUYER_EMAILS: it mints only for these buyers; anyone else who
#     reaches the sandbox checkout (it needs only the public client token and
#     the 4242 test card) is ignored. 503 `config-sandbox-buyers` while empty.
#   - SANDBOX_SIGNING_UNTIL: a full ISO timestamp with a zone, at most 7 days
#     ahead. After it, the Worker 503s (`config-sandbox-until`), so a forgotten
#     instance stops minting on its own.
#   - TANDEM_ISSUANCE_ENV = "sandbox": no update entitlement is written, and
#     ledger keys use the `test` mode segment.
# Afterwards, delete the whole sandbox Worker, not just its key (the daily cron
# would otherwise keep running and alert once its API key expires):
#   npx wrangler@4.130.0 delete --env sandbox
# ---------------------------------------------------------------------------
[env.sandbox.vars]
TANDEM_ISSUANCE_ENV = "sandbox"
RESEND_FROM = "REPLACE_WITH_VERIFIED_SENDER"
SUPPORT_EMAIL = "REPLACE_WITH_SUPPORT_INBOX"
PADDLE_PRICE_IDS = "REPLACE_WITH_SANDBOX_PADDLE_PRICE_IDS"
SANDBOX_BUYER_EMAILS = "REPLACE_WITH_YOUR_OWN_TEST_EMAIL"
SANDBOX_SIGNING_UNTIL = "REPLACE_WITH_ISO_TIMESTAMP_AT_MOST_7_DAYS_AHEAD"
# ALERT_WEBHOOK_URL = "REPLACE_WITH_INCOMING_WEBHOOK_URL"

# Its OWN namespaces, never production's. Create them with
# `npx wrangler kv namespace create LEDGER_KV --env sandbox` (and LICENSE_KV).
[[env.sandbox.kv_namespaces]]
binding = "LICENSE_KV"
id = "REPLACE_WITH_SANDBOX_LICENSE_KV_NAMESPACE_ID"

[[env.sandbox.kv_namespaces]]
binding = "LEDGER_KV"
id = "REPLACE_WITH_SANDBOX_LEDGER_KV_NAMESPACE_ID"
